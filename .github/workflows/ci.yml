name: qualification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Full-history and worktree secret scan
        run: python tools/secret_scan.py .
      - name: Source tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile source, tests and oracle
        run: python -m compileall -q src tests oracle
      - name: Reproducible package and offline installed-wheel journeys
        run: python tools/qualify.py --output build/qualification
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: qualify-${{ matrix.os }}
          path: build/qualification
          if-no-files-found: error
  compare:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: qualify-*
          path: build/platforms
      - name: Compare exact portable bytes and release identity
        run: python tools/compare_platforms.py build/platforms
